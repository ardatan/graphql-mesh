sources:
  - name: OpenBrewery
    handler:
      jsonSchema:
        endpoint: https://api.openbrewerydb.org
        operations:
          - type: Query
            field: breweries
            path: breweries
            method: GET
            requestSample: ./json-samples/breweriesInput.json
            responseSample: ./json-samples/breweries.json

plugins:
  - responseCache:
      ttlPerCoordinate:
        # Spec field coordinate (exact match; Query.* is not a Schema Coordinate)
        - coordinate: Query.breweries
          ttl: 3600

cache:
  cfwKv:
    namespace: MESH

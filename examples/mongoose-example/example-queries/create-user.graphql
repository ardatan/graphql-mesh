mutation CreateUser {
  insertOneUser(
    document: {
      name: "John Doe"
      age: 25
      languages: [{ language: "English", skill: native }]
      contacts: { email: "john@doe.com", phones: ["+000000000000"] }
      gender: male
      address: { street: "Not Existed St." }
    }
  ) {
    name
    age
    languages {
      language
      skill
    }
    contacts {
      email
      phones
    }
    gender
    address {
      street
    }
  }
}

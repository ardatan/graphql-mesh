sources:
  - name: GraphQLAPI
    handler:
      graphql:
        endpoint: '{env.GRAPHQL_API}'
        # Use some fetch strategy
        timeout: 2000
        retry: 2

plugins:
  - rateLimit:
      config:
        - type: Query
          field: '*'
          max: 3
          ttl: 10000
          identifier: 'context.headers.host'
  - depthLimit:
      maxDepth: 5
  - responseCache:
      # Plugin-level TTL (ms). Prefer Spec Schema Coordinates for per-field overrides
      # (Type or Type.field). Wildcards like Query.* are not Spec coordinates and do not match.
      ttl: 3600

cache:
  cfwKv:
    namespace: MESH

sources:
  - name: Geo
    handler:
      postgraphile:
        connectionString: postgres://postgres:docker@localhost:5432/postgres
    transforms:
      - prefix:
          value: Geo
  - name: Github
    handler:
      graphql:
        endpoint: https://api.github.com/graphql
        source: https://docs.github.com/public/fpt/schema.docs.graphql
        operationHeaders:
          Authorization: bearer {env.GH_ACCESS_TOKEN}
          User-Agent: GraphQL Mesh
        batch: false
    transforms:
      # GitHub Query implements Node and exposes relay: Query!. Under federation
      # that allows Node/Query entrypoints → Geo Query fields without a Query @key.
      - ./strip-query-node-interface: {}
      - filterSchema:
          filters:
            - Query.!{node, nodes, relay}
      - prefix:
          value: Github
          includeRootOperations: true
          # Keep Query.id unprefixed if present; strip-query-node-interface removes implements Node.
          ignore:
            - Query.id

additionalTypeDefs: |
  extend type GeoCity {
    developers(limit: Int = 2): [GithubUser] @resolveTo(
      requiredSelectionSet: "{ name }",
      sourceName: "Github",
      sourceTypeName: "Query",
      sourceFieldName: "Githubsearch",
      sourceArgs: {
        type: "USER",
        query: "location:{root.name}",
        first: "{args.limit}"
      },
      result: "nodes"
    )
  }

documents:
  - ./src/test.query.graphql

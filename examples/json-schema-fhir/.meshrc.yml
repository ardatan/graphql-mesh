sources:
  - name: FHIR
    handler:
      jsonSchema:
        endpoint: https://hapi.fhir.org/baseR4
        operations:
          - type: Query
            field: resourceById
            method: GET
            path: /{args.resourceType}/{args.id}?_format=application/json
            responseSchema: ./fhir.schema.json#/definitions/ResourceList
          - type: Query
            field: resourceByName
            method: GET
            path: /{args.resourceType}/?name={args.name}?_format=application/json
            responseSchema: ./fhir.schema.json#/definitions/Bundle
          - type: Query
            field: resourceByOtherResourceId
            method: GET
            path: /{args.resourceType}?subject={args.otherResourceType}/{args.otherResourceId}
            responseSchema: ./fhir.schema.json#/definitions/Bundle

# Prefer federation entity stubs across a few related subgraphs when targeting
# Apollo Router (see e2e/json-schema-fhir). For a single Mesh source, field-level
# `@connect` replaces Mesh `@resolveTo` → `Query.resourceById` using Type/id paths.
additionalTypeDefs: |
  extend type Reference {
    resource: ResourceList @connect(
      source: "FHIR"
      http: { GET: "/{$this.reference->split(\"/\")->get(0)}/{$this.reference->split(\"/\")->get(1)}?_format=application/json" }
      selection: "$"
    )
  }

documents:
  - ./example-queries/*.graphql

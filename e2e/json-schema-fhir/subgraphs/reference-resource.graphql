# Apollo-style hand SDL: @link imports + apps only (Mesh compose injects defs).
# Virtual Reference.resource: Resource — FHIR Type/id → entity stub (no @source).
extend schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/federation/v2.6", import: ["@key", "@shareable"])
  @link(url: "https://specs.apollo.dev/connect/v0.4", import: ["@connect"])

type Query {
  """Placeholder so Compose accepts a join-only subgraph."""
  _referenceResource: String @shareable
}

"""FHIR resource handle resolved from `Reference.reference` (`Type/id`)."""
interface Resource {
  id: String
}

type Patient implements Resource @key(fields: "id", resolvable: false) {
  id: String!
}

type Observation implements Resource @key(fields: "id", resolvable: false) {
  id: String!
}

type Reference
  @key(fields: "reference")
  @connect(
    selection: """
    reference: $this.reference
    """
  ) {
  reference: String!
  # Connectors abstract types need literal `__typename` per `->match` branch.
  resource: Resource
    @connect(
      selection: """
      $this.reference->split("/")->get(0)->match(
        ["Patient", {
          __typename: $("Patient")
          id: $this.reference->split("/")->get(1)
        }],
        ["Observation", {
          __typename: $("Observation")
          id: $this.reference->split("/")->get(1)
        }],
        [@, null]
      )
      """
    )
}

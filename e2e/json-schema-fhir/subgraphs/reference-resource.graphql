"""
Mini Connectors subgraph: virtual `Reference.resource` join only.

JSON Schema loaders own Patient / Observation / Reference scalars+fields.
This subgraph adds `Reference.resource` as a Patient entity stub so Hive/Router
can `_entities`-resolve into `patients` — no HTTP `@source` / `@transport`
(selection-only `@connect`).

Field types match the opt-in FHIR `scalarMap` (`string`→`String`, `id`→`ID`).
"""
schema
  @link(url: "https://specs.apollo.dev/link/v1.0")
  @link(url: "https://specs.apollo.dev/federation/v2.6", import: ["@key", "@shareable"])
  @link(url: "https://specs.apollo.dev/connect/v0.4", import: ["@connect"]) {
  query: Query
}

directive @link(url: String!, import: [String]) repeatable on SCHEMA
directive @connect(
  source: String
  http: ConnectHTTP
  selection: JSONSelection!
  entity: Boolean
  errors: ConnectorErrors
  isSuccess: JSONSelection
) repeatable on FIELD_DEFINITION | OBJECT
directive @key(fields: String!, resolvable: Boolean = true) repeatable on OBJECT
directive @shareable repeatable on OBJECT | FIELD_DEFINITION

# Companion types required by the standard `@connect` directive signature
# (even though applications here only set `selection`).
scalar JSONSelection
scalar URLPathTemplate

input ConnectHTTP {
  GET: URLPathTemplate
  HEAD: URLPathTemplate
  POST: URLPathTemplate
  PUT: URLPathTemplate
  PATCH: URLPathTemplate
  DELETE: URLPathTemplate
  headers: [HTTPHeaderMapping!]
  body: JSONSelection
  queryParams: JSONSelection
}

input HTTPHeaderMapping {
  name: String!
  value: String
  from: String
}

input ConnectorErrors {
  message: JSONSelection
  extensions: JSONSelection
}

type Query {
  """Placeholder so Compose accepts a join-only subgraph."""
  _referenceResource: String @shareable
}

# Entity so the planner can hop from observations' Reference to this subgraph's
# `resource` field (value-type contribution alone cannot cross subgraphs).
# Type-level @connect supplies resolveReference for Hive `_entities`.
type Reference
  @key(fields: "reference")
  @connect(
    selection: """
    reference: $this.reference
    """
  ) {
  reference: String!
  resource: Patient
    @connect(
      selection: """
      __typename: $("Patient")
      id: $this.reference->split("/")->get(1)
      """
    )
}

# FHIR `Patient.id` is `#/definitions/string` (not `id`) — scalarMap → String.
type Patient @key(fields: "id", resolvable: false) {
  id: String!
}

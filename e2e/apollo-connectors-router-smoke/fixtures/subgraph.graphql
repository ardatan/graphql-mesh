extend schema
  @link(url: "https://specs.apollo.dev/federation/v2.14", import: ["@key", "@shareable"])
  @link(url: "https://specs.apollo.dev/connect/v0.4", import: ["@connect", "@source"])
  @source(name: "api", http: { baseURL: "http://127.0.0.1:19876" })

type Query {
  hello: HelloPayload @connect(source: "api", http: { GET: "/hello" }, selection: "message")
}

type HelloPayload {
  message: String
}

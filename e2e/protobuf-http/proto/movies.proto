syntax = "proto3";

enum Genre {
  UNSPECIFIED = 0;
  ACTION = 1;
  DRAMA = 2;
}

message Movie {
  string name = 1;
  int64 year = 2;
  float rating = 3;
  repeated string cast = 4;
  Genre genre = 6;
}

message MovieRequest {
  Movie movie = 1;
}

message MoviesResult {
  repeated Movie result = 1;
}

service Example {
  rpc GetMovies(MovieRequest) returns (MoviesResult) {}
}

openapi: 3.0.3
info:
  title: Products (Connectors entity owner)
  version: 1.0.0
paths:
  /products/{id}:
    get:
      # Single key-typed arg → compose marks entity: true (no Mesh @merge).
      operationId: getProduct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Product
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
components:
  schemas:
    Product:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        price:
          type: number

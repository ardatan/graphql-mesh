# Live Microsoft Graph e2e (v0 example-queries via Hive + Apollo Router).
# Runs only when OData/Connectors-related paths change — not on every PR.
#
# Auth (pick one):
#   A) Auto refresh (preferred): secrets MSGRAPH_TENANT_ID + MSGRAPH_CLIENT_ID +
#      MSGRAPH_REFRESH_TOKEN (+ optional MSGRAPH_CLIENT_SECRET for confidential apps).
#      Job exchanges the refresh token for a short-lived access token.
#   B) Manual: secret MSGRAPH_ACCESS_TOKEN (expires ~1h — not for day-to-day CI).
# Without credentials the live describe is skipped (job stays green).
name: odata-msgraph-live

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'packages/loaders/odata/**'
      - 'packages/transports/rest/**'
      - 'packages/fusion/composition/**'
      - 'e2e/odata-msgraph/**'
      - 'examples/odata-microsoft/**'
      - '.github/workflows/odata-msgraph-live.yml'
  push:
    branches:
      - master
    paths:
      - 'packages/loaders/odata/**'
      - 'packages/transports/rest/**'
      - 'packages/fusion/composition/**'
      - 'e2e/odata-msgraph/**'
      - 'examples/odata-microsoft/**'
      - '.github/workflows/odata-msgraph-live.yml'
  # Manual re-run after rotating the refresh token
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  NODE_TLS_REJECT_UNAUTHORIZED: 0
  APOLLO_ELV2_LICENSE: accept
  NODE_NO_WARNINGS: 1
  YARN_ENABLE_HARDENED_MODE: 0
  MSGRAPH_LIVE: '1'

jobs:
  live-e2e:
    name: e2e / msgraph live
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Refresh Microsoft Graph access token
        id: token
        env:
          MSGRAPH_TENANT_ID: ${{ secrets.MSGRAPH_TENANT_ID }}
          MSGRAPH_CLIENT_ID: ${{ secrets.MSGRAPH_CLIENT_ID }}
          MSGRAPH_CLIENT_SECRET: ${{ secrets.MSGRAPH_CLIENT_SECRET }}
          MSGRAPH_REFRESH_TOKEN: ${{ secrets.MSGRAPH_REFRESH_TOKEN }}
          MSGRAPH_ACCESS_TOKEN_SECRET: ${{ secrets.MSGRAPH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -n "${MSGRAPH_TENANT_ID:-}" ] && [ -n "${MSGRAPH_CLIENT_ID:-}" ] && [ -n "${MSGRAPH_REFRESH_TOKEN:-}" ]; then
            echo "Exchanging refresh token for access token…"
            BODY=(
              -d "client_id=${MSGRAPH_CLIENT_ID}"
              -d "grant_type=refresh_token"
              -d "refresh_token=${MSGRAPH_REFRESH_TOKEN}"
              -d "scope=https://graph.microsoft.com/.default offline_access"
            )
            if [ -n "${MSGRAPH_CLIENT_SECRET:-}" ]; then
              BODY+=(-d "client_secret=${MSGRAPH_CLIENT_SECRET}")
            fi
            RESP=$(curl -sS -X POST \
              "https://login.microsoftonline.com/${MSGRAPH_TENANT_ID}/oauth2/v2.0/token" \
              "${BODY[@]}")
            ACCESS=$(node -e 'const j=JSON.parse(process.argv[1]); if(!j.access_token){console.error(j); process.exit(1)}; process.stdout.write(j.access_token)' "$RESP")
            echo "MSGRAPH_ACCESS_TOKEN=${ACCESS}" >> "$GITHUB_ENV"
            echo "token_source=refresh" >> "$GITHUB_OUTPUT"
            echo "Access token acquired via refresh_token."
          elif [ -n "${MSGRAPH_ACCESS_TOKEN_SECRET:-}" ]; then
            echo "MSGRAPH_ACCESS_TOKEN=${MSGRAPH_ACCESS_TOKEN_SECRET}" >> "$GITHUB_ENV"
            echo "token_source=static" >> "$GITHUB_OUTPUT"
            echo "Using static MSGRAPH_ACCESS_TOKEN secret (short-lived)."
          else
            echo "token_source=none" >> "$GITHUB_OUTPUT"
            echo "No MS Graph credentials configured — live suite will skip."
          fi

      - name: set up env
        uses: the-guild-org/shared-config/setup@v1
        with:
          node-version-file: .node-version
      - name: build
        run: yarn build
      - name: relink
        run: yarn install
      - name: Run live MS Graph e2e
        run: yarn test:e2e e2e/odata-msgraph --forceExit

# Hive Gateway package-level federation/stitch benches (moved into Mesh).
# Runs when Mesh-owned stitch/fusion/executor/transport packages or benches change,
# so regressions show up as Gateway-facing performance impact before publish.
name: Bench
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'bench/**'
      - 'packages/stitch/**'
      - 'packages/stitching-directives/**'
      - 'packages/delegate/**'
      - 'packages/wrap/**'
      - 'packages/batch-delegate/**'
      - 'packages/batch-execute/**'
      - 'packages/federation/**'
      - 'packages/executors/**'
      - 'packages/fusion/runtime/**'
      - 'packages/transports/common/**'
      - 'packages/transports/http/**'
      - 'packages/transports/http-callback/**'
      - 'packages/transports/ws/**'
      - '.github/workflows/bench.yml'
      - 'vitest.bench.config.mts'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_NO_WARNINGS: 1
  APOLLO_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [node, bun]
    name: ${{ matrix.runner }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up env
        uses: the-guild-org/shared-config/setup@v1
        with:
          node-version-file: .node-version
      - if: matrix.runner == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Build
        run: yarn build
      - name: Bench
        run: ${{ matrix.runner == 'bun' && 'bun' || 'yarn' }} bench
        env:
          BENCH_DURATION: '30000'
          BENCH_WARMUP_TIME: '5000'
          BENCH_WARMUP_ITERATIONS: '10'
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bench-results-${{ matrix.runner }}
          path: bench/results.json
          if-no-files-found: ignore

  # Sticky PR comment (same marocchino pattern as Gateway snapshot / Guild website preview).
  comment:
    name: sticky PR comment
    needs: bench
    # Same-repo PRs only: fork GITHUB_TOKEN is read-only for comments and would
    # fail this reporting check even when benches succeed (website.yml pattern).
    if: >
      github.event_name == 'pull_request' && always() &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      pull-requests: write
    steps:
      - name: Download bench artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-results-*
          path: bench-artifacts
          merge-multiple: false
      # Absolute Hz drifts across runners/days; sticky ratios are gated vs master.
      - name: Download master node baseline
        id: master_baseline
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p master-bench-artifacts/bench-results-node
          RUN_ID=$(gh api "repos/${{ github.repository }}/actions/workflows/bench.yml/runs?branch=master&status=success&per_page=1" --jq '.workflow_runs[0].id // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No successful master Bench run; skip ratio gate."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
          gh run download "$RUN_ID" -n bench-results-node -D master-bench-artifacts/bench-results-node -R "${{ github.repository }}"
      - name: Format bench markdown + ratio gate
        id: md
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          # Fail when a sticky ratio drops more than this fraction vs master (0.10 = 10%).
          BENCH_RATIO_REGRESSION_MAX: '0.10'
          MASTER_BASELINE_AVAILABLE: ${{ steps.master_baseline.outputs.available }}
          MASTER_BASELINE_RUN_ID: ${{ steps.master_baseline.outputs.run_id }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'bench-artifacts';
            if (!fs.existsSync(root)) {
              core.setOutput('body', '### 📊 Federation / stitch benches\n\n_No bench artifacts uploaded._');
              core.setOutput('has_regress', 'false');
              return;
            }
            function loadFrom(dir, runner) {
              const p = path.join(dir, `bench-results-${runner}`, 'results.json');
              if (!fs.existsSync(p)) return null;
              return JSON.parse(fs.readFileSync(p, 'utf8'));
            }
            function isFiniteNumber(n) {
              return typeof n === 'number' && Number.isFinite(n);
            }
            function rows(data) {
              const out = [];
              if (!data?.files) return out;
              for (const file of data.files) {
                const suite = (file.filepath || file.name || '')
                  .split('/')
                  .slice(-2)
                  .join('/')
                  .replace(/\.bench\.ts$/, '');
                for (const group of file.groups || []) {
                  for (const b of group.benchmarks || []) {
                    out.push({
                      suite,
                      name: b.name,
                      hz: b.hz,
                      rme: b.rme,
                      complete: isFiniteNumber(b.hz) && isFiniteNumber(b.rme),
                    });
                  }
                }
              }
              return out;
            }
            // Prefer short sticky labels; still match pre-rename master baselines.
            const NAME_ALIASES = {
              'Hive GW w/ Stitching': ['Hive GW w/ Stitching', 'Hive Gateway w/ Tools'],
              'Hive GW w/ Router QP': [
                'Hive GW w/ Router QP',
                'Hive Gateway w/ Hive Router Query Planner',
              ],
              Stitching: ['Stitching'],
              'Apollo Gateway': ['Apollo Gateway'],
            };
            function findNamed(list, canonical) {
              const aliases = NAME_ALIASES[canonical] || [canonical];
              return list.find((r) => aliases.includes(r.name) && r.complete) || null;
            }
            function stickyRatios(list) {
              const stitch = findNamed(list, 'Stitching');
              const apollo = findNamed(list, 'Apollo Gateway');
              const hiveStitch = findNamed(list, 'Hive GW w/ Stitching');
              const hiveRouter = findNamed(list, 'Hive GW w/ Router QP');
              const out = [];
              if (stitch && apollo && apollo.hz > 0) {
                out.push({
                  key: 'Stitching / Apollo (node)',
                  value: stitch.hz / apollo.hz,
                });
              }
              if (hiveStitch && hiveRouter && hiveRouter.hz > 0) {
                out.push({
                  key: 'Hive GW w/ Stitching / Hive GW w/ Router QP (node)',
                  value: hiveStitch.hz / hiveRouter.hz,
                });
              }
              return out;
            }
            const node = rows(loadFrom(root, 'node'));
            const bun = rows(loadFrom(root, 'bun'));
            const byKey = new Map();
            for (const r of node) byKey.set(`${r.suite}::${r.name}`, { suite: r.suite, name: r.name, node: r });
            for (const r of bun) {
              const k = `${r.suite}::${r.name}`;
              const cur = byKey.get(k) || { suite: r.suite, name: r.name };
              cur.bun = r;
              byKey.set(k, cur);
            }
            const fmt = (r) =>
              r == null || !r.complete ? '—' : `${r.hz.toFixed(2)} Hz ±${r.rme.toFixed(2)}%`;
            let table = `| Suite | Benchmark | Node | Bun |\n|---|---|---:|---:|\n`;
            for (const row of byKey.values()) {
              table += `| \`${row.suite}\` | ${row.name} | ${fmt(row.node)} | ${fmt(row.bun)} |\n`;
            }
            const prRatios = stickyRatios(node);
            const ratioLines = prRatios.map(
              (r) => `**${r.key}:** **${r.value.toFixed(2)}×**`,
            );
            const ratioBlock = ratioLines.length ? `\n${ratioLines.join('\n')}\n` : '';

            const maxDrop = Number(process.env.BENCH_RATIO_REGRESSION_MAX || '0.10');
            const masterAvailable = process.env.MASTER_BASELINE_AVAILABLE === 'true';
            const masterRunId = process.env.MASTER_BASELINE_RUN_ID || '';
            const regressions = [];
            let vsMaster = '';
            if (masterAvailable) {
              const masterNode = rows(loadFrom('master-bench-artifacts', 'node'));
              const masterRatios = stickyRatios(masterNode);
              const masterByKey = new Map(masterRatios.map((r) => [r.key, r.value]));
              const lines = [];
              for (const pr of prRatios) {
                const base = masterByKey.get(pr.key);
                if (!isFiniteNumber(base) || base <= 0) {
                  lines.push(`- ${pr.key}: PR **${pr.value.toFixed(2)}×** (no master baseline)`);
                  continue;
                }
                const delta = (pr.value - base) / base;
                const pct = `${delta >= 0 ? '+' : ''}${(delta * 100).toFixed(1)}%`;
                const bad = delta < -maxDrop;
                if (bad) {
                  regressions.push(
                    `${pr.key}: ${pr.value.toFixed(2)}× vs master ${base.toFixed(2)}× (${pct}; limit -${(maxDrop * 100).toFixed(0)}%)`,
                  );
                }
                lines.push(
                  `- ${pr.key}: PR **${pr.value.toFixed(2)}×** vs master **${base.toFixed(2)}×** (${pct})${bad ? ' ❌' : ''}`,
                );
              }
              const runLink = masterRunId
                ? ` · [master run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${masterRunId})`
                : '';
              vsMaster = [
                '',
                `### vs master (sticky ratios)${runLink}`,
                '',
                ...lines,
                '',
                `_Gate: fail if a sticky ratio drops more than ${(maxDrop * 100).toFixed(0)}% vs master._`,
              ].join('\n');
            } else {
              vsMaster =
                '\n_No successful master Bench baseline — ratio gate skipped._\n';
            }

            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const short = String(sha).slice(0, 7);
            const body = [
              '### 📊 Federation / stitch benches',
              '',
              `Commit \`${short}\` · [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              table.trim(),
              ratioBlock,
              vsMaster,
              '',
              '_Updated by the Bench workflow (sticky)._',
            ].join('\n');
            core.setOutput('body', body);
            core.setOutput('has_regress', regressions.length ? 'true' : 'false');
            fs.writeFileSync('bench-ratio-regressions.txt', regressions.join('\n') + (regressions.length ? '\n' : ''));
      - name: Sticky PR comment
        if: always() && steps.md.outputs.body != ''
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: federation-bench
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: ${{ steps.md.outputs.body }}
      - name: Fail on sticky ratio regression vs master
        if: steps.md.outputs.has_regress == 'true'
        run: |
          echo "Sticky bench ratio regression vs master:"
          cat bench-ratio-regressions.txt
          exit 1

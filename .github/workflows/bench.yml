# Hive Gateway package-level federation/stitch benches (moved into Mesh).
# Runs when Mesh-owned stitch/fusion/executor/transport packages or benches change,
# so regressions show up as Gateway-facing performance impact before publish.
name: Bench
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - 'bench/**'
      - 'packages/stitch/**'
      - 'packages/stitching-directives/**'
      - 'packages/delegate/**'
      - 'packages/wrap/**'
      - 'packages/batch-delegate/**'
      - 'packages/batch-execute/**'
      - 'packages/federation/**'
      - 'packages/executors/**'
      - 'packages/fusion/runtime/**'
      - 'packages/transports/common/**'
      - 'packages/transports/http/**'
      - 'packages/transports/http-callback/**'
      - 'packages/transports/ws/**'
      - '.github/workflows/bench.yml'
      - 'vitest.bench.config.mts'
      - 'package.json'
      - 'yarn.lock'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

env:
  NODE_NO_WARNINGS: 1
  APOLLO_TELEMETRY_DISABLED: 1
  CI: true

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        runner: [node, bun]
    name: ${{ matrix.runner }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Set up env
        uses: the-guild-org/shared-config/setup@v1
        with:
          node-version-file: .node-version
      - if: matrix.runner == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Build
        run: yarn build
      - name: Bench
        run: ${{ matrix.runner == 'bun' && 'bun' || 'yarn' }} bench
        env:
          BENCH_DURATION: '30000'
          BENCH_WARMUP_TIME: '5000'
          BENCH_WARMUP_ITERATIONS: '10'
      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results-${{ matrix.runner }}
          path: bench/results.json
          if-no-files-found: ignore

  # Sticky PR comment (same marocchino pattern as Gateway snapshot / Guild website preview).
  comment:
    name: sticky PR comment
    needs: bench
    if: github.event_name == 'pull_request' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Download bench artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-results-*
          path: bench-artifacts
          merge-multiple: false
      - name: Format bench markdown
        id: md
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffb93a87bf3c8c # v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const root = 'bench-artifacts';
            if (!fs.existsSync(root)) {
              core.setOutput('body', '### 📊 Federation / stitch benches\n\n_No bench artifacts uploaded._');
              return;
            }
            function load(runner) {
              const p = path.join(root, `bench-results-${runner}`, 'results.json');
              if (!fs.existsSync(p)) return null;
              return JSON.parse(fs.readFileSync(p, 'utf8'));
            }
            function rows(data) {
              const out = [];
              if (!data?.files) return out;
              for (const file of data.files) {
                const suite = (file.filepath || file.name || '')
                  .split('/')
                  .slice(-2)
                  .join('/')
                  .replace(/\.bench\.ts$/, '');
                for (const group of file.groups || []) {
                  for (const b of group.benchmarks || []) {
                    out.push({
                      suite,
                      name: b.name,
                      hz: b.hz,
                      rme: b.rme,
                    });
                  }
                }
              }
              return out;
            }
            const node = rows(load('node'));
            const bun = rows(load('bun'));
            const byKey = new Map();
            for (const r of node) byKey.set(`${r.suite}::${r.name}`, { suite: r.suite, name: r.name, node: r });
            for (const r of bun) {
              const k = `${r.suite}::${r.name}`;
              const cur = byKey.get(k) || { suite: r.suite, name: r.name };
              cur.bun = r;
              byKey.set(k, cur);
            }
            const fmt = (r) =>
              r == null ? '—' : `${r.hz.toFixed(2)} Hz ±${r.rme.toFixed(2)}%`;
            let table = `| Suite | Benchmark | Node | Bun |\n|---|---|---:|---:|\n`;
            for (const row of byKey.values()) {
              table += `| \`${row.suite}\` | ${row.name} | ${fmt(row.node)} | ${fmt(row.bun)} |\n`;
            }
            const stitchNode = node.find((r) => r.name === 'Stitching');
            const apolloNode = node.find((r) => r.name === 'Apollo Gateway');
            let ratio = '';
            if (stitchNode && apolloNode && apolloNode.hz > 0) {
              ratio = `\n**Stitching / Apollo (node):** **${(stitchNode.hz / apolloNode.hz).toFixed(2)}×**\n`;
            }
            const sha = context.payload.pull_request?.head?.sha || context.sha;
            const short = String(sha).slice(0, 7);
            const body = [
              '### 📊 Federation / stitch benches',
              '',
              `Tip \`${short}\` · [workflow run](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})`,
              '',
              table.trim(),
              ratio,
              '',
              '_Updated by the Bench workflow (sticky)._',
            ].join('\n');
            core.setOutput('body', body);
      - name: Sticky PR comment
        uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          header: federation-bench
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          message: ${{ steps.md.outputs.body }}

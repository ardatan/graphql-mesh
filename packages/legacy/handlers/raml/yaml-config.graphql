extend type Handler {
  raml: RAMLHandler
}

type RAMLHandler {
  source: String!
  endpoint: String
  schemaHeaders: JSON
  operationHeaders: JSON
  ignoreErrorResponses: Boolean
  selectQueryOrMutationField: [SelectQueryOrMutationFieldConfig]
  queryParams: Any

  """
  Timeout for the HTTP request in milliseconds
  """
  timeout: Int

  """
  Policy for Federation Connectors `@connect(selection:)` size and depth.
  See `ConnectSelectionOptions` on the JSON Schema handler.
  """
  connectSelection: ConnectSelectionOptions
}

enum QueryOrMutation {
  query
  mutation
  Query
  Mutation
}

type SelectQueryOrMutationFieldConfig {
  type: QueryOrMutation!
  fieldName: String!
}

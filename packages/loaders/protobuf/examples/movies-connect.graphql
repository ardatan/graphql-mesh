# Hand-authored ConnectRPC-style subgraph (no Connect loader).
# Same @protobuf__rpc surface as gRPC loader emit; HTTPS location → HTTP + default application/proto.

extend schema
  @link(url: "https://the-guild.dev/graphql/mesh/protobuf/v1.0", import: ["@protobuf__rpc"])

schema @transport(subgraph: "movies", kind: "protobuf", location: "https://movies.example.com") {
  query: Query
}

type Query {
  moviesByYear(year: Int!): MoviesResult!
    @protobuf__rpc(
      service: "Example"
      method: "GetMovies"
      args: """
      # Encode GraphQL field arguments into the protobuf request message.
      # Each line is fieldId(protoType): graphqlPath (relative to this field args).
      1(message): $args {
        2(int64): year
      }
      """
      selection: """
      # Decode the protobuf response message into GraphQL fields.
      # Each line is fieldId(protoType): graphqlFieldName.
      1(repeated message): result {
        1(string): name
        2(int64): year
        3(float): rating
        4(repeated string): cast
        6(enum{UNSPECIFIED=0,ACTION=1,DRAMA=2}): genre
      }
      """
    )
}

type MoviesResult {
  result: [Movie!]!
}

type Movie {
  name: String!
  year: Int!
  rating: Float
  cast: [String!]
  genre: Genre
}

enum Genre {
  UNSPECIFIED
  ACTION
  DRAMA
}

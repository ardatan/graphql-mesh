    @join__field(graph: DISCOUNTS, requires: "subtotalCents")
    @join__field(graph: SHIPPING_RATES, external: true)
    @join__field(graph: TAX, external: true)
  shippingTotalCents: Int!
    @join__field(graph: CHECKOUT, external: true)
    @join__field(graph: SHIPPING_RATES, requires: "subtotalCents discountTotalCents")
    @join__field(graph: TAX, external: true)
  taxTotalCents: Int!
    @join__field(graph: CHECKOUT, external: true)
    @join__field(graph: TAX, requires: "subtotalCents discountTotalCents shippingTotalCents")
  riskScore: Float! @join__field(graph: FRAUD, requires: "grandTotalCents itemCount")
  installmentPlans: [InstallmentPlan!]!
    @join__field(graph: INSTALLMENTS, requires: "grandTotalCents")

    @join__field(
      graph: CHECKOUT
      requires: "subtotalCents discountTotalCents shippingTotalCents taxTotalCents"
    )
    @join__field(graph: FRAUD, external: true)
    @join__field(graph: INSTALLMENTS, external: true)
    @join__field(graph: LOYALTY, external: true)
  checkoutUrl: String @join__field(graph: CHECKOUT)
  discountTotalCents: Int!
